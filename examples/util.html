<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>util 組件 - layui</title>

<link rel="stylesheet" href="../src/css/layui.css">

<style>
body{padding: 50px;}
</style>
</head>
<body>

<fieldset class="layui-elem-field">
  <legend>默認 body 委託元素</legend>
  <div class="layui-field-box">
    <button class="layui-btn" lay-on="e1">事件 e1</button>
    <button class="layui-btn" lay-on="e2">事件 e2</button>
    <button class="layui-btn" lay-on="e3">事件 e3</button>
    <button class="layui-btn" lay-bind="e1">hover: lay-bind - 事件 e1</button>
    <button class="layui-btn" lay-active="e1">hover: lay-active - 事件 e1</button>
    <button class="layui-btn layui-btn-primary" lay-on="getBodyEvents">查看 body 的事件集合</button>
  </div>
</fieldset>

<br><br>

<fieldset class="layui-elem-field">
  <legend>自定義委託元素</legend>
  <div class="layui-field-box">
    <div id="ID-util-on-test">
      <button class="layui-btn" lay-on="e1">事件 e1 - 測試阻止冒泡</button>
      <button class="layui-btn" lay-on="e5">事件 e5</button>
      <button class="layui-btn" lay-on="e6">hover: 事件 e6</button>
      <button class="layui-btn layui-btn-primary" lay-on="getElemEvents">查看該委託元素的事件集合</button>
    </div>
  </div>
</fieldset>


<hr>

<div id="test"></div>

<hr>

<div id="test1"></div>

<script src="../src/layui.js"></script>
<script>
layui.use(['lay', 'util', 'layer'], function(){
  var $ = layui.$;
  var util = layui.util;
  var layer = layui.layer;
  var lay = layui.lay;

  // 固定塊
  util.fixbar({
    bars: [{ // 定義可顯示的 bar 列表信息 -- v2.8.0 新增
      type: 'share',
      icon: 'layui-icon-share'
    }, {
      type: 'help',
      icon: 'layui-icon-help'
    }, {
      type: 'cart',
      icon: 'layui-icon-cart',
      style: 'background-color: #FF5722;'
    }, {
      type: 'groups',
      content: '群',
      style: 'font-size: 21px;'
    }],
    // bar1: true,
    // bar2: true,
    // default: false, 是否顯示默認的 bar 列表 --  v2.8.0 新增
    // bgcolor: '#393D52', // bar 的默認背景色
    // css: {right: 100, bottom: 100},
    // target: '#target-test', // 插入 fixbar 節點的目標元素選擇器
    // duration: 300, // top bar 等動畫時長（毫秒）
    on: { // 任意事件 --  v2.8.0 新增
      mouseenter: function(type){
        layer.tips(type, this, {
          tips: 4,
          fixed: true
        });
      },
      mouseleave: function(type){
        layer.closeAll('tips');
      }
    },
    // 點擊事件
    click: function(type){
      console.log(this, type);
      // layer.msg(type);
    }
  });


  // 批量處理事件
  util.on({
    e1: function(othis){
      alert(othis.html())
    },
    e2: function(othis){
      alert('body:'+ othis.html())
    },
    getBodyEvents: function(othis, e) {
      var dataCache = $(e.delegateTarget).data('UTIL_ON_DATA');
      console.log(dataCache.events);
    }
  });

  // Test: 事件集的替換和增加
  util.on({
    e1: function(othis){ // 重置事件 e1
      alert(othis.html() + ' - replace')
    },
    e3: function(othis){ // 增加事件 e3
      alert(othis.html())
    }
  });

  // 自定義觸發事件的元素屬性名、自定義觸發事件的方式
  util.on('lay-bind', {
    e1: layui.throttle(function(othis) {
      layer.tips(othis.html(), this, { tips: 3 });
    }, 3000), // 3s 內不重複執行
    e2: function() {
      console.log(111);
    }
  }, {
    trigger: 'mouseenter'
  });
  // Test: 不同屬性、相同值
  util.on('lay-active', {
    e1: function(othis) {
      this.innerHTML = 'hover: lay-active - 事件 e1 - '+ (Math.random()*100000 | 0);
    }
  }, {
    trigger: 'mouseenter'
  });

  // 自定義觸發事件的委託元素
  util.on({
    // 此處與委託在 body 上的事件共用了 e1 名稱，以測試事件冒泡
    e1: function(othis, e){
      this.innerHTML = 'click: '+ (Math.random()*100000 | 0);
      layui.stope(e); // 阻止事件冒泡
    },
    e5: function(othis, e) {
      this.innerHTML = 'click: '+ (Math.random()*100000 | 0);
    },
    getElemEvents: function(othis, e) {
      var dataCache = $(e.delegateTarget).data('UTIL_ON_DATA');
      console.log(dataCache.events);
    }
  }, {
    elem: '#ID-util-on-test'
  });

  // 自定義觸發事件的委託元素 + 自定義觸發事件
  util.on({
    e6: function(othis, e) {
      this.innerHTML = 'hover: 事件 e6 - '+ (Math.random()*100000 | 0);
    }
  }, {
    elem: '#ID-util-on-test',
    trigger: 'mouseenter'
  });


  // 倒計時
  var countdown = util.countdown({
    date: '2099-12-31 00:00:00', // 目標時間值
    now: new Date(), // 當前時間，一般為服務器時間，此處以本地時間為例
    ready: function(){ // 初始操作
      clearTimeout(util.countdown.timer); // 清除舊定時器，防止多次渲染時重複執行。實際使用時不常用
    },
    clock: function(obj, inst){  // 計時中
      var str = [obj.d,'天',obj.h,'時',obj.m,'分',obj.s,'秒'].join(' ');
      lay('#test').html(str);
      util.countdown.timer = inst.timer; // 記錄當前定時器，以便在重複渲染時清除。實際使用時不常用
    },
    done: function(obj, inst){ // 計時完成
      layer.msg('Time is up');
    }
  });

  // 某個時間在當前時間的多久前
  var str = util.timeAgo(new Date(2017,7,15,2,58,0));
  $('#test1').html('示例寫於：'+ str);

  // 轉換日期格式
  var timer = null
  var toDateString = function (format) {
    var dateString = util.toDateString(new Date(), format);
    $('#test3').html(dateString)
  }
  timer = setInterval(() => {
    toDateString($('#test2').val())
  }, 50)

});
</script>
</body>
