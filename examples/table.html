<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <title>表格操作 - layui</title>
  <link rel="stylesheet" href="../src/css/layui.css">
  <style>
    body{padding: 32px; /*overflow-y: scroll;*/}
    .layui-table-view{margin: 8px 0;}
  </style>
</head>
<body>

<div class="layui-btn-container">
  <a href="table.html" class="layui-btn layui-btn-primary layui-border-green">表格綜合</a>
  <a href="table-test.html" class="layui-btn">表格操作</a>
  <a href="table-static.html" class="layui-btn">靜態表格</a>
</div>

<script type="text/html" id="barDemo">
  <a class="layui-btn layui-btn-xs" lay-event="edit">編輯</a>
  <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">刪除</a>
</script>

<table id="test"></table>
<table id="test-data"></table>
<table id="test-arr"></table>
<table id="test-json"></table>

<div style="display: none1;">
  <table class="layui-table" lay-data="{width:800, height: 300, url:'json/table/demo2.json', page: true, even: true, limit: 6, toolbar: true}">
    <thead>
      <tr>
        <th lay-data="{checkbox:true, fixed:'left'}" rowspan="2"></th>
        <th lay-data="{field:'username', width:80}" rowspan="2">聯繫人</th>
        <th lay-data="{field:'amount', width:120}" rowspan="2">金額</th>
        <th lay-data="{align:'center'}" colspan="5">地址</th>
        <th lay-data="{fixed: 'right', width: 155, align: 'center', toolbar: '#barDemo'}" rowspan="2">操作</th>
      </tr>
      <tr>
        <th lay-data="{field:'province', width:130}">省</th>
        <th lay-data="{field:'city', width:130}">市</th>
        <th lay-data="{field:'zone', width:200}">區</th>
        <th lay-data="{field:'address', width:120}">小區</th>
        <th lay-data="{field:'house', width:150}">單元</th>
      </tr>
    </thead>
  </table>

  <table class="layui-table" lay-data="{url:'json/table/demo2.json', page: true, limit: 6, toolbar: true}">
    <thead>
      <tr>
        <th lay-data="{field:'username'}" rowspan="3">聯繫人</th>
        <th lay-data="{field:'amount', width:120,hide:1}" rowspan="3">金額</th>
        <th lay-data="{align:'center'}" colspan="5">地址1</th>
        <th lay-data="{align:'center'}" colspan="2">地址2</th>
        <th lay-data="{fixed: 'right', width: 120, align: 'center', toolbar: '#barDemo'}" rowspan="3">操作</th>
      </tr>
      <tr>
        <th lay-data="{field:'province', width:120,hide:1}" rowspan="2">省</th>
        <th lay-data="{field:'city', width:80,hide:1}" rowspan="2">市</th>
        <th lay-data="{align:'center'}" colspan="2">詳細</th>
        <th lay-data="{field:'zone'}" rowspan="2">區</th>
        <th lay-data="{field:'province', width:80}" rowspan="2">省</th>
        <th lay-data="{field:'city', width:80}" rowspan="2">市</th>
      </tr>
      <tr>
        <th lay-data="{field:'address', width:120,hide:1}">小區</th>
        <th lay-data="{field:'house', width:150,hide:1}">單元</th>
      </tr>
    </thead>
  </table>

  <div class="layui-btn-group">
    <button class="layui-btn" data-type="parseTable">轉化為數據表格</button>
  </div>

  <table class="layui-table" lay-skin="line" lay-filter="parse-table-demo">
    <thead>
      <tr>
        <th lay-data="{checkbox:true}"></th>
        <th lay-data="{field:'username', width:200}">暱稱</th>
        <th lay-data="{field:'joinTime', width:150}">加入時間</th>
        <th lay-data="{field:'sign'}">簽名</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td></td>
        <td>賢心1</td>
        <td>2016-11-28</td>
        <td>人生就像是一場修行a</td>
      </tr>
      <tr>
        <td></td>
        <td>賢心2</td>
        <td>2016-11-29</td>
        <td>人生就像是一場修行b</td>
      </tr>
      <tr>
        <td></td>
        <td>賢心3</td>
        <td>2016-11-30</td>
        <td>人生就像是一場修行c</td>
      </tr>
    </tbody>
  </table>

  <table class="layui-table" lay-filter="parse-table-demo">
    <thead>
      <tr>
       <td rowspan="2" lay-data="{field:'louceng'}">樓層</td>
       <td colspan="2">1單元</td>
       <td colspan="2">2單元</td>
      </tr>
      <tr>
       <td lay-data="{field:'men1', width:80}">1門</td>
       <td lay-data="{field:'men2', width:80}">2門</td>
       <td lay-data="{field:'men3', width:80}">1門</td>
       <td lay-data="{field:'men4', width:80}">2門</td>
      </tr>
     </thead>
     <tbody>
      <tr>
       <td>3樓</td>
       <td>301</td>
       <td>302</td>
       <td>301</td>
       <td>302</td>
      </tr>
      <tr>
       <td>2樓</td>
       <td>201</td>
       <td>202</td>
       <td>201</td>
       <td>202</td>
      </tr>
      <tr>
       <td>1樓</td>
       <td>101</td>
       <td>102</td>
       <td>101</td>
       <td>102</td>
      </tr>
    </tbody>
  </table>
</div>

<script src="../src/layui.js" src1="https://cdn.staticfile.org/layui/2.7.6/layui.js"></script>
<script>

      ,groups: 1
      ,first: false
      ,last: false

    ,height: 300
    ,cellMinWidth: 80
    //,skin: 'line'

    }, {

      ,"experience": "65"

    }, {
      "id": "10004"
      ,"username": "賢心"
      ,"email": "xianxin@layui.com"
      ,"sex": "男"

    //,size: 'lg' //尺寸

    elem: '#test-arr',
    data: ['a','b','c','d','e','f','g','h','i'],
    page: true,

    cols: [[
      {type: 'numbers', title: '序號'},

  });

  $('i').on('click', function(){

</body>
</html>
