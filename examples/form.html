<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>表單模組 - layui</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="apple-mobile-web-app-status-bar-style" content="black"> 
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">

    <link rel="stylesheet" href="../src/css/layui.css">
    <style>
      body{padding: 16px;}
    </style>
  </head>
<body>
  <form class="layui-form" method="get" lay-filter="top" id="AAA">
    <div class="layui-form-item">
      <div class="layui-input-inline">
        <input type="text" name="arr[]" lay-verify="required" placeholder="請輸入" autocomplete="off" class="layui-input">
      </div>
      <div class="layui-input-inline">
        <input type="text" name="arr[]" lay-verify="required" placeholder="請輸入" autocomplete="off" class="layui-input">
      </div>
      <div class="layui-input-inline">
        <input type="text" name="arr[title]" lay-verify="required" placeholder="請輸入" autocomplete="off" class="layui-input">
      </div>
    </div>
    <div class="layui-form-item">
      <button class="layui-btn" id="testSubmit">立即提交</button>
    </div>
  </form>

  <hr>

  <form class="layui-form layui-form-pane1" action="" lay-filter="first">
    <div class="layui-form-item">
      <label class="layui-form-label">輸入框</label>
      <div class="layui-input-block">
        <input type="text" name="title" lay-verify="required|title" lay-reqText="標題不能為空" required placeholder="請輸入標題" autocomplete="off" class="layui-input" >
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">手機</label>
      <div class="layui-input-block">
        <input type="tel" name="phone" lay-verify="required|phone" autocomplete="off" class="layui-input demo-phone">
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">驗證碼</label>
      <div class="layui-input-inline">
        <input type="text" name="vercode" lay-verify="required" autocomplete="off" class="layui-input">
      </div>
      <div class="layui-form-mid" style="padding: 0!important;"> 
        <button type="button" class="layui-btn layui-btn-primary" lay-on="get-vercode">獲取驗證碼</button>
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">郵箱</label>
      <div class="layui-input-block">
        <input type="email" name="email" lay-verify="email"  lay-verType="alert" autocomplete="off" class="layui-input">
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">生日</label>
      <div class="layui-input-block">
        <input type="text" name="date" id="date" lay-verify="date" placeholder="yyyy-MM-dd" autocomplete="off" class="layui-input">
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">密碼</label>
      <div class="layui-input-inline">
        <input type="password" name="password" lay-verify="required|pass" placeholder="請輸入密碼" autocomplete="off" class="layui-input">
      </div>
      <div class="layui-form-mid layui-word-aux">請務必填寫使用者名稱</div>
    </div>
    <div class="layui-form-item">
      <div class="layui-inline">
        <label class="layui-form-label">範圍</label>
        <div class="layui-input-inline" style="width: 100px;">
          <input type="text" name="price_min" placeholder="￥" autocomplete="off" class="layui-input">
        </div>
        <div class="layui-form-mid">-</div>
        <div class="layui-input-inline" style="width: 100px;">
          <input type="text" name="price_max" placeholder="￥" autocomplete="off" class="layui-input">
        </div>
      </div>
      <div class="layui-inline">
        <label class="layui-form-label">行內表單</label>
        <div class="layui-input-block">
          <select name="quiz" lay-verify="required" lay-verType="tips"  lay-filter="quiz111">
            <option value="">請選擇問題</option>
            <option value="0">你工作的 第一個城市</option>
            <option value="1" disabled>你的工號</option>
            <option value="2">
              你最喜歡的老師
            </option>
          </select>
        </div>
      </div>
      <div class="layui-inline">
        <label class="layui-form-label">select分組</label>
        <div class="layui-input-block">
          <select name="quiz" lay-filter="quiz">
            <option value="">請選擇問題</option>
            <optgroup label="城市記憶">
              <option value="0">你工作的第一個城市</option>
            </optgroup>
            <optgroup label="學生時代">
              <option value="1" disabled>你的工號</option>
              <option value="2">你最喜歡的老師</option>
            </optgroup>
          </select>
        </div>
      </div>
    </div>
    
    <div class="layui-form-item">
      <label class="layui-form-label">選擇框</label>
      <div class="layui-input-block">
        <select name="interest" lay-filter="interest">
          <option value=""></option>
          <option value="0">寫作</option>
          <option value="1">閱讀</option>
          <option value="2">遊戲</option>
          <option value="3">音樂</option>
          <option value="4">旅行</option>
        </select>
      </div>
    </div>
    
    <div class="layui-form-item">
      <div class="layui-inline">
        <label class="layui-form-label">搜索選擇框</label>
        <div class="layui-input-block">
          <select name="interest-search" lay-filter="interest-search" lay-search>
            <option value="">請搜索</option>
            <option value="寫作">寫作</option>
            <option value="閱讀" disabled>閱讀</option>
            <option value="遊戲" disabled>遊戲</option>
            <option value="音樂">音樂</option>
            <option value="旅行">旅行</option>
            <option value="讀書">讀書</option>
            <option value="1">layer</option>
            <option value="2" disabled>laydate</option>
            <option value="3">3</option>
            <option value="4">layim</option>
            <option value="5">laypage</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
          </select>
        </div>
      </div>
      <div class="layui-inline">
        <label class="layui-form-label">搜索分組框</label>
        <div class="layui-input-block">
          <select name="interest-search-group" lay-filter="interest-search-group" lay-search="">
            <option value="">請搜索</option>
            <optgroup label="分組a">
              <option value="a1">a1</option>
              <option value="a2">a2</option>
            </optgroup>
            <optgroup label="分組aa">
              <option value="aa1">aA1</option>
              <option value="aa2">aA2</option>
            </optgroup>
            <optgroup label="分組b">
              <option value="b1">b1</option>
              <option value="b2">b2</option>
            </optgroup>
            <optgroup label="分組bb">
              <option value="bb1">bb1</option>
              <option value="bb2">bb2</option>
            </optgroup>
            <optgroup label="分組bbb">
              <option value="bbb1">bBb1</option>
              <option value="bbb2">bBB2</option>
            </optgroup>
            <optgroup label="分組c">
              <option value="c1">c1</option>
              <option value="c2">c2</option>
            </optgroup>
            <optgroup label="分組cc">
              <option value="cc1">cc1</option>
              <option value="cc2">cc2</option>
            </optgroup>
            <optgroup label="分組ccc">
              <option value="ccc1">ccc1</option>
              <option value="ccc2">ccc2</option>
            </optgroup>
            <optgroup label="分組cccc">
              <option value="cccc1">cccc1</option>
              <option value="cccc2">cccc2</option>
            </optgroup>
          </select>
        </div>
      </div>
    </div>
    
    <div class="layui-form-item" pane>
      <label class="layui-form-label">覈取方塊</label>
      <div class="layui-input-block">
        <input type="checkbox" name="like[write]" title="寫作">
        <input type="checkbox" name="like[read]" title="閱讀">
        <input type="checkbox" name="like[game]" title="遊戲" disabled>
      </div>
    </div>
    <div class="layui-form-item" pane>
      <label class="layui-form-label">原始覈取方塊</label>
      <div class="layui-input-block">
        <input type="checkbox" name="like1[write]" lay-skin="primary" title="寫作">
        <input type="checkbox" name="like1[read]" lay-skin="primary" title="閱讀">
        <input type="checkbox" name="like1[game]" lay-skin="primary" title="遊戲" disabled>
      </div>
    </div>
    <div class="layui-form-item" pane>
      <label class="layui-form-label">開關關</label>
      <div class="layui-input-block">
        <input type="checkbox" name="close" lay-skin="switch" title="開關">
        <input type="checkbox" name="close2" lay-skin="switch" title="開關" lay-text="ON|OFF" disabled>
      </div>
    </div>
    <div class="layui-form-item" pane>
      <label class="layui-form-label">開關開</label>
      <div class="layui-input-block">
        <input type="checkbox" checked name="open" lay-skin="switch" lay-filter="switchTest" lay-text="ON|OFF">
        <input type="checkbox" name="open2" lay-skin="switch" lay-filter="switchTest" lay-text="已繫結|繫結">
      </div>
    </div>
    <div class="layui-form-item" pane>
      <label class="layui-form-label">單選框</label>
      <div class="layui-input-block">
        <input type="radio" name="sex" value="男" title="男">
        <input type="radio" name="sex" value="女" title="女" checked>
        <input type="radio" name="sex" value="中型" title="中" disabled>
      </div>
    </div>
    <div class="layui-form-item" pane>
      <label class="layui-form-label">單選框</label>
      <div class="layui-input-block">
        <input type="radio" name="sex.id" value="男" title="男">
        <input type="radio" name="sex.id" value="女" title="女" checked>
        <input type="radio" name="sex.id" value="中型" title="中">
      </div>
    </div>
    <div class="layui-form-item layui-form-text">
      <label class="layui-form-label">請填寫描述</label>
      <div class="layui-input-block">
        <textarea placeholder="請輸入內容" class="layui-textarea" name="desc"></textarea>
      </div>
    </div>
    <div class="layui-form-item">
      <div class="layui-input-block">
        <button class="layui-btn" lay-submit lay-filter="*">立即提交</button>
        <button type="reset" class="layui-btn layui-btn-primary">重置</button>
      </div>
    </div>
  </form>

  <br><br><br>


  <script src="../src/layui.js" src1="https://cdn.staticfile.org/layui/2.6.8/layui.js"></script>
  <script>

  layui.use(['form', 'util', 'laydate'], function(){
    var $ = layui.$;
    var form = layui.form;
    var layer = layui.layer;
    var util = layui.util;
    var laydate = layui.laydate;

    //自定義驗證規則
    form.verify({
      title: function(value){
        if(value.length < 5){
          return '標題也太短了吧';
        }
      }
      ,pass: [/(.+){6,12}$/, '密碼必須6到12位']
      ,money: [
        /^\d+\.\b\d{2}\b$/
        ,'金額必須為小數保留兩位'
      ]
      //,n: [/^(\d)+$/, '數字校驗']
    });
    
    /*
    form.on('submit(top)', function(data){
      console.log(data);
      return false;
    });
    */
    
    //方法提交
  $('#testSubmit').on('click', function(){
    form.submit('top', function(data){
      layer.confirm('確定提交么？', function(index){
        layer.close(index);

        // 驗證均通過後執行提交
        setTimeout(function(){
          alert(JSON.stringify(data.field));
        })
        
      });
    });
    return false;
  });
    
    
    //日期
    laydate.render({
      elem: '#date'
    });
    
    //初始賦值
    var thisValue = form.val('first', {
      'title': '測試測試測試'
      //,'phone': 11111111111
      ,'email': 'xu@sentsin.com'
      ,'date': '2021-05-30'
      ,'password': 123123
      //,'quiz': 2
      ,'interest': 3
      ,'like[write]': true
      //,'open': false
      ,'sex': '男'
      ,'desc': 'form 是我們非常看重的一塊'
      ,xxxxxxxxx: 123
    });

    
    //事件
    form.on('select(quiz111)', function(data){
      console.log('select: ', this, data);
    });
    
    form.on('select(quiz)', function(data){
      console.log('select.quiz：', this, data);
    });
    
    form.on('select(interest)', function(data){
      console.log('select.interest: ', this, data);
    });
    
    form.on('checkbox', function(data){
      console.log(this.checked, data.elem.checked);
    });
    
    form.on('switch', function(data){
      console.log(data);
    });
    
    form.on('radio', function(data){
      console.log(data);
    });
    
    // 提交事件
    form.on('submit(*)', function(data){
      console.log(data)
      alert(JSON.stringify(data.field));
      return false;
    });

    // 普通事件
    util.on('lay-on', {
      "get-vercode": function(othis){
        var isvalid = form.validate('.demo-phone');

        // 驗證通過
        if(isvalid){
          layer.msg('手機號驗證通過，執行發送驗證碼的操作');
        }
      }
    });
    
  });

  </script>



  <h3>原始表單除錯：</h3>

      <option value="">請選擇問題</option>

      <option value="你的工號">你的工號</option>
      <option value="你最喜歡的老師">你最喜歡的老師</option>

      <option value="你的工號">你的工號</option>

    <button type="submit">原始表單，測試提交</button>
  </form>

</body>
</html>
